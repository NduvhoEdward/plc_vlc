r="middle" font-size="16">PLC adapter</text><text x="691" y="334" text-anchor="middle" font-size="16">Gateway</text><g fill="#c0622a"><circle cx="330" cy="150" r="7"/><circle cx="366" cy="150" r="7"/><circle cx="402" cy="150" r="7"/></g><text x="40" y="404" font-size="21" font-weight="600">The wires carry power — and a data signal.</text><text x="40" y="437" font-size="16" fill="#586577">Conceptual layout. Adapter appearance and wiring are illustrative.</text></g></svg>