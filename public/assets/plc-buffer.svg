<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">A buffer bridges PLC and VLC</title><desc id="desc">Bursty PLC input enters a queue at the gateway. The LED sends queued data at the optical transmitter's pace to a photodiode receiver.</desc><rect width="800" height="480" fill="#f4f7fa"/><g font-family="Segoe UI,Arial,sans-serif" fill="#16202e"><text x="40" y="48" font-size="15" letter-spacing="3">THE HYBRID HANDOFF</text><path d="M55 216H240" stroke="#c0622a" stroke-width="5"/><g fill="#c0622a"><rect x="66" y="189" width="18" height="54" rx="3"/><rect x="95" y="189" width="18" height="54" rx="3"/><rect x="124" y="189" width="18" height="54" rx="3"/><rect x="153" y="189" width="18" height="54" rx="3"/></g><text x="130" y="285" text-anchor="middle" font-size="18">Bursty PLC input</text><rect x="240" y="130" width="250" height="176" rx="18" fill="#fff" stroke="#d3dce6" stroke-width="2"/><text x="365" y="168" text-anchor="middle" font-size="18" font-weight="600">Gateway buffer</text><g stroke="#d3dce6" stroke-width="2"><rect x="269" y="190" width="34" height="52" rx="5" fill="#f3dccb"/><rect x="309" y="190" width="34" height="52" rx="5" fill="#f3dccb"/><rect x="349" y="190" width="34" height="52" rx="5" fill="#f3dccb"/><rect x="389" y="190" width="34" height="52" rx="5" fill="#f3dccb"/><rect x="429" y="190" width="34" height="52" rx="5" fill="#f4f7fa"/></g><text x="365" y="276" text-anchor="middle" font-size="15" fill="#586577">Hold → pace → release</text><path d="M490 216H555" stroke="#1d93cf" stroke-width="4"/><path d="M565 216L695 156V276Z" fill="#d6ecf7"/><rect x="547" y="197" width="18" height="38" rx="5" fill="#1d93cf"/><circle cx="720" cy="216" r="22" fill="#fff" stroke="#16202e" stroke-width="2"/><path d="M713 206V226M713 216H728" stroke="#16202e" stroke-width="2"/><text x="556" y="285" text-anchor="middle" font-size="18">LED</text><text x="713" y="312" text-anchor="middle" font-size="16">Photodiode</text><text x="620" y="131" text-anchor="middle" font-size="16" fill="#1d93cf">Visible light</text><text x="40" y="392" font-size="21" font-weight="600">Different links. One orderly stream.</text><text x="40" y="427" font-size="16" fill="#586577">Conceptual queue: finite storage, limited optical output capacity.</text></g></svg>